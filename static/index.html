<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTrotter — Empowering Personalized Travel Planning</title>
    <meta name="description" content="Personalized travel-planning platform with multi-city itineraries, dynamic budgeting, travel intelligence, calendar visualization, and public sharing.">
    
    <!-- Google Fonts: Outfit (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Design System CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Toast Notification Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Top Header Navigation -->
        <header class="app-header">
            <div class="header-container">
                <div class="brand" onclick="navigateTo('dashboard')">
                    <div class="brand-icon">
                        <i class="fa-solid fa-earth-asia"></i>
                    </div>
                    <div class="brand-text">
                        <span class="brand-title">GlobeTrotter</span>
                        <span class="brand-badge">Odoo Hackathon</span>
                    </div>
                </div>

                <nav class="nav-links" id="main-nav">
                    <button class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
                        <i class="fa-solid fa-compass"></i> Dashboard
                    </button>
                    <button class="nav-item" data-page="trips" onclick="navigateTo('trips')">
                        <i class="fa-solid fa-suitcase-rolling"></i> My Trips
                    </button>
                    <button class="nav-item" data-page="destinations" onclick="navigateTo('destinations')">
                        <i class="fa-solid fa-map-location-dot"></i> Destinations
                    </button>
                    <button class="nav-item" data-page="activities" onclick="navigateTo('activities')">
                        <i class="fa-solid fa-ticket"></i> Activities
                    </button>
                    <button class="nav-item" data-page="community" onclick="navigateTo('community')">
                        <i class="fa-solid fa-users"></i> Community Hub
                    </button>
                    <button class="nav-item admin-only" id="nav-admin" style="display: none;" data-page="admin" onclick="navigateTo('admin')">
                        <i class="fa-solid fa-chart-line"></i> Admin Analytics
                    </button>
                </nav>

                <div class="header-actions">
                    <button class="btn btn-outline btn-search-trigger" onclick="openGlobalSearchModal()" title="Global Search (Ctrl+K)">
                        <i class="fa-solid fa-magnifying-glass"></i> <span class="search-kbd-text">Search</span> <kbd class="search-kbd">Ctrl K</kbd>
                    </button>

                    <button class="btn btn-primary btn-glow" onclick="openCreateTripModal()">
                        <i class="fa-solid fa-plus"></i> <span>Plan New Trip</span>
                    </button>
                    
                    <div id="auth-section" class="auth-section">
                        <!-- Populated by JS: user profile or login buttons -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main" id="main-content">
            <!-- Dynamic Page Views Rendered Here -->
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-container">
                <div class="footer-brand">
                    <div class="brand-icon small">
                        <i class="fa-solid fa-earth-asia"></i>
                    </div>
                    <span>GlobeTrotter Travel Planning Platform</span>
                </div>
                <div class="footer-meta">
                    <span>Powered by Odoo ORM &amp; PostgreSQL 17</span>
                    <span>&bull;</span>
                    <span>Multi-City Itineraries &bull; Dynamic Budgeting &bull; Travel Intelligence</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Application Script -->
    <script src="/js/app.js"></script>
</body>
</html>
